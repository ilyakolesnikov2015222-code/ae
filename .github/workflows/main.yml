name: Build Fabric Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether-client-1.21.4-v1.5.0.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build JAR
        run: gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: aether-client-mod
          path: |
            aether-client-1.21.4-v1.5.0.zip/build/libs/*.jar
            !aether-client-1.21.4-v1.5.0.zip/build/libs/*-sources.jar
            !aether-client-1.21.4-v1.5.0.zip/build/libs/*-dev.jar
            
