name: Build Fabric Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip archive
        run: unzip -q aether-client-1.21.4-v1.5.0.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build JAR
        run: |
          BUILD_DIR=$(dirname "$(find . -name "build.gradle" | head -n 1)")
          cd "$BUILD_DIR"
          gradle build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: aether-client-mod
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
            
